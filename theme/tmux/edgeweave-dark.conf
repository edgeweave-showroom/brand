set -g status-style "fg=#7a879b,bg=#0a1321"
set -g status-left-style "fg=#27a6c7,bold"
set -g window-status-style "fg=#7a879b"
set -g window-status-current-style "fg=#ebebeb,bg=#1b2a45,bold"
set -g window-status-activity-style "fg=#d9a55b"
set -g window-status-bell-style "fg=#f94f30,bold"
set -g pane-border-style "fg=#26395a"
set -g pane-active-border-style "fg=#27a6c7"
set -g message-style "fg=#ebebeb,bg=#1b2a45"
set -g message-command-style "fg=#d9a55b,bg=#1b2a45"
set -g mode-style "fg=#ebebeb,bg=#17516b"
set -g copy-mode-match-style "fg=#0d1829,bg=#d9a55b"
set -g copy-mode-current-match-style "fg=#0d1829,bg=#27a6c7"
set -g popup-border-style "fg=#26395a"
set -g menu-style "fg=#bdbfc1,bg=#142137"
set -g menu-selected-style "fg=#ebebeb,bg=#17516b"
set -g menu-border-style "fg=#26395a"
set -g clock-mode-colour "#27a6c7"
set -g display-panes-colour "#4a5a75"
set -g display-panes-active-colour "#27a6c7"
