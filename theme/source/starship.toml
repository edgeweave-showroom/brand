#
# The Edgeweave prompt for Starship, without its palette. generate.py, next to
# this file, writes it to ../tool/starship/edgeweave-dark.toml, the palette
# after it; this comment stays out. The palette travels with the prompt, so
# its colours go by name here rather than in palette.toml.

[character]
success_symbol = '[❯](bold cerulean)'
error_symbol = '[❯](bold vermilion)'

[username]
format = '[$user]($style)[ in](slate) '
style_user = 'bold text'
style_root = 'bold red'

[hostname]
format = '[$ssh_symbol$hostname]($style)[ in](slate) '
ssh_symbol = ' '
style = 'bold petrol'

[directory]
style = 'bold cerulean'
read_only = ' 󰌾'

[cmd_duration]
format = '[took](slate) [$duration]($style) '
style = 'bold slate'

# Every other module whose format has a linking word, as Starship 1.26 writes
# it, the word in slate; and the symbols of Starship's Nerd Font Symbols
# preset, https://starship.rs/presets/nerd-font.

[aws]
format = '[on](slate) [$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = ' '

[azure]
format = '[on](slate) [$symbol($subscription)]($style) '
symbol = ' '

[battery]
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
unknown_symbol = '󰂑 '
empty_symbol = '󰂎 '

