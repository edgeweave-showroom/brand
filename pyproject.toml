[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing commas are the formatter's job
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-FileCopyrightText: \\d{4} Technologies Edgeweave"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["."]
# Scripts named alike in different directories are told apart by their path.
explicit_package_bases = true
