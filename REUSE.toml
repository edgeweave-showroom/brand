version = 1
SPDX-PackageName = "Edgeweave brand assets"
SPDX-PackageSupplier = "Organization: Technologies Edgeweave"
SPDX-PackageDownloadLocation = "https://github.com/edgeweave-showroom/brand"

# Default: every file is a brand asset. Later annotations override earlier
# ones, so anything not matched below falls under the restrictive terms.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Technologies Edgeweave"
SPDX-License-Identifier = "LicenseRef-Edgeweave-Brand"

# Scripts, repository configuration and documentation.
[[annotations]]
path = [
  "**/*.py",
  "**/*.sh",
  "**/*.js",
  "**/*.ts",
  "**/*.md",
  "**/*.toml",
  "**/*.yml",
  "**/*.yaml",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
]
SPDX-FileCopyrightText = "2026 Technologies Edgeweave"
SPDX-License-Identifier = "MIT"

# Colour themes and their sources: free to use and share unmodified, with
# attribution; the Edgeweave name on them stays under the brand terms. After
# the annotation above, which would otherwise claim the files written in TOML.
[[annotations]]
path = [
  "theme/terminal/**",
  "theme/editor/**",
  "theme/tool/**",
  "theme/source/palette.toml",
]
SPDX-FileCopyrightText = "2026 Technologies Edgeweave"
SPDX-License-Identifier = "CC-BY-ND-4.0"

# The Starship prompt: a colour theme like the others, with the symbols of
# Starship's Nerd Font Symbols preset, under Starship's ISC licence. After
# the annotation above, which would otherwise claim the generated one.
[[annotations]]
path = [
  "theme/source/starship.toml",
  "theme/tool/starship/edgeweave-dark.toml",
]
SPDX-FileCopyrightText = [
  "2026 Technologies Edgeweave",
  "2019-2022 Starship Contributors",
]
SPDX-License-Identifier = "CC-BY-ND-4.0 AND ISC"
