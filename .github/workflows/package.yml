name: Release package

on:
  push:
    branches: [main]
    paths:
      - logo/symbol/**
      - logo/full/**
      - logo/wordmark/**
      - logo/README.md
      - logo/source/package.py
      - LICENSES/LicenseRef-Edgeweave-Brand.txt
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, instead of the next minor (v2.0 for a redesign)
        required: true
  pull_request:

permissions: {}

# One run at a time per branch: two pushes to main would otherwise both
# compute the same next version. A pull request's newer run replaces the
# older one; a push to main always runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: this run publishes a release.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
          else
            last=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[].tagName')
            version=$([ -n "$last" ] && echo "${last%.*}.$(( ${last##*.} + 1 ))" || echo v1.0)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
      - run: uv run --locked --no-dev logo/source/package.py "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgeweave-logo
          path: dist/edgeweave-logo.zip

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the release, its tag and its asset
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edgeweave-logo
      - run: >
          gh release create "$VERSION" edgeweave-logo.zip
          --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
